<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lanewise: front desk</title>
<style>
  /* Round 2 comp: brushed-metal frame, glossy booked tiles, bevelled buttons. */
  body { margin: 0; font-family: Georgia, serif; background: #c9ced3; }
  .frame { margin: 24px; padding: 16px; border: 1px solid #7a8087; border-radius: 10px;
    background: linear-gradient(180deg, #e8ebee 0%, #b9bfc5 100%); box-shadow: inset 0 1px 0 #fff, 0 2px 6px #0006; }
  h1 { margin: 0 0 12px; font-size: 20px; text-shadow: 0 1px 0 #fff; }
  .grid { display: grid; grid-template-columns: 80px repeat(4, 1fr); gap: 4px; }
  .slot { padding: 8px; border-radius: 6px; background: linear-gradient(#fff, #d8dde2); box-shadow: inset 0 -2px 3px #0003; }
  .booked { background: linear-gradient(#5aa0e6, #1f5fae); color: #fff; box-shadow: inset 0 2px 2px #fff8, inset 0 -3px 4px #0006; }
  button { padding: 8px 16px; border: 1px solid #555; border-radius: 6px; background: linear-gradient(#f4f4f4, #bcbcbc);
    box-shadow: inset 0 1px 0 #fff, 0 2px 2px #0004; }
</style>
</head>
<body>
<div class="frame">
  <h1>Today, lanes 1 to 4</h1>
  <div class="grid">
    <div></div><div class="slot">Lane 1</div><div class="slot">Lane 2</div><div class="slot">Lane 3</div><div class="slot">Lane 4</div>
    <div>07:00</div><div class="slot booked">Masters club</div><div class="slot">Free</div><div class="slot booked">Lessons</div><div class="slot">Free</div>
    <div>07:30</div><div class="slot booked">Masters club</div><div class="slot">Free</div><div class="slot booked">Lessons</div><div class="slot booked">M. Ortega</div>
  </div>
  <p><button>Book a lane</button> <button>Move booking</button></p>
</div>
</body>
</html>
